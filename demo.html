      { id: 'stress_relief', label: 'Giảm stress', icon: '🌿', desc: 'Thư giãn, giảm căng thẳng' },
      { id: 'health', label: 'Sức khỏe tổng thể', icon: '❤️', desc: 'Duy trì lối sống khỏe mạnh' },
    ]

    const EQUIP_LABELS = { bodyweight: 'Không cần dụng cụ', dumbbell: 'Tạ đơn', resistance_band: 'Dây kháng lực', yoga_mat: 'Thảm yoga', pull_up_bar: 'Xà đơn', jump_rope: 'Dây nhảy' }

    // --- LOCAL STORAGE HOOK ---
    function useLocalStorage(key, fallback) {
      const [val, setVal] = useState(() => { try { const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback } catch { return fallback } })
      const setAndSave = (next) => { const resolved = typeof next === 'function' ? next(val) : next; setVal(resolved); try { localStorage.setItem(key, JSON.stringify(resolved)) } catch { } }
      return [val, setAndSave]
    }

    function toYmd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` }
    function parseYmd(s) { if (!s) return new Date(); const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) }
    function fmtDayMonth(d) { return `${d.getDate()}/${d.getMonth() + 1}` }
    function mondayOf(d) { const date = new Date(d); const day = (date.getDay() + 6) % 7; date.setDate(date.getDate() - day); date.setHours(0, 0, 0, 0); return date }

    // Estimate calories for a session
    function estimateCalories(sessionItems, durationMin) {
      let totalCal = 0
      sessionItems.forEach(it => {
        const ex = EX_MAP[it.exerciseId]
        if (!ex) return
        if (it.durationSec) {
          totalCal += (ex.calPerMin || 4) * (it.durationSec / 60) * (it.sets || 1)
        } else if (it.reps) {
          // Estimate ~3 seconds per rep
          const repTime = (it.reps * 3 + (it.restSec || 30)) * (it.sets || 1)
          totalCal += (ex.calPerMin || 4) * (repTime / 60)
        }
      })
      return Math.round(totalCal)
    }

    // Get required equipment for a session
    function sessionEquipment(sessionItems) {
      const eqSet = new Set()
      sessionItems.forEach(it => {
        const ex = EX_MAP[it.exerciseId]
        if (ex) ex.equipment.forEach(e => eqSet.add(e))
      })
      return [...eqSet]
    }

        e.preventDefault(); setError('')

          if (users.find(u => u.email === email)) { setError('Email này đã được đăng ký'); return }
          const newUser = { id: 'user_' + Date.now(), name: name.trim(), email: email.trim(), avatar, password, createdAt: new Date().toISOString(), profileCompleted: false }
          setUsers([...users, newUser]); onLogin(newUser)
        } else {
          if (!email.trim()) { setError('Vui lòng nhập email'); return }
          if (!password) { setError('Vui lòng nhập mật khẩu'); return }

      return (

            <div className="absolute -bottom-32 -left-32 w-96 h-96 rounded-full bg-emerald-300/10 blur-3xl animate-pulse-soft" style={{ animationDelay: '1s' }}></div>
          </div>

              <div className="inline-flex items-center justify-center w-20 h-20 rounded-3xl glass-card text-4xl mb-4 shadow-2xl">🍃</div>

              <p className="text-emerald-200/80 text-sm font-medium mt-2">Hành trình sức khỏe bắt đầu từ đây</p>
            </div>
            <div className="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl">
              <div className="flex rounded-2xl bg-white/10 p-1 mb-6">
                <button type="button" onClick={() => { setMode('login'); setError('') }} className={`flex-1 rounded-xl py-2.5 text-sm font-bold transition-all duration-300 ${mode === 'login' ? 'bg-white text-[#0A4D2E] shadow-lg' : 'text-white/70 hover:text-white'}`}>Đăng nhập</button>
                <button type="button" onClick={() => { setMode('register'); setError('') }} className={`flex-1 rounded-xl py-2.5 text-sm font-bold transition-all duration-300 ${mode === 'register' ? 'bg-white text-[#0A4D2E] shadow-lg' : 'text-white/70 hover:text-white'}`}>Đăng ký</button>
              </div>
              {error && <div className="mb-4 rounded-xl bg-red-500/20 border border-red-400/30 px-4 py-2.5 text-xs font-semibold text-red-100 flex items-center gap-2 animate-fade-in"><span>⚠️</span><span>{error}</span></div>}
              <form onSubmit={handleSubmit} className="space-y-4">
                {mode === 'register' && <div className="animate-fade-in"><label className="block text-xs font-bold text-white/80 mb-1.5">Họ và tên</label><input type="text" placeholder="Nguyễn Văn A" value={name} onChange={e => setName(e.target.value)} className="w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3 text-sm text-white placeholder:text-white/40 focus:bg-white/15 transition-all" /></div>}
                <div><label className="block text-xs font-bold text-white/80 mb-1.5">Email</label><input type="email" placeholder="email@vidu.com" value={email} onChange={e => setEmail(e.target.value)} className="w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3 text-sm text-white placeholder:text-white/40 focus:bg-white/15 transition-all" /></div>
                <div><label className="block text-xs font-bold text-white/80 mb-1.5">Mật khẩu</label><div className="relative"><input type={showPassword ? 'text' : 'password'} placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} className="w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3 pr-12 text-sm text-white placeholder:text-white/40 focus:bg-white/15 transition-all" /><button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-1/2 -translate-y-1/2 text-white/50 hover:text-white text-sm">{showPassword ? '🙈' : '👁️'}</button></div></div>
                {mode === 'register' && <>
                  <div className="animate-fade-in"><label className="block text-xs font-bold text-white/80 mb-1.5">Xác nhận mật khẩu</label><input type="password" placeholder="••••••••" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3 text-sm text-white placeholder:text-white/40 focus:bg-white/15 transition-all" /></div>

              </form>
              {mode === 'login' && <p className="text-center text-xs text-white/50 mt-4">Chưa có tài khoản? <button type="button" onClick={() => setMode('register')} className="text-white font-bold hover:underline">Đăng ký ngay</button></p>}
              {mode === 'register' && <p className="text-center text-xs text-white/50 mt-4">Đã có tài khoản? <button type="button" onClick={() => setMode('login')} className="text-white font-bold hover:underline">Đăng nhập</button></p>}
            </div>
            <p className="text-center text-[11px] text-emerald-300/40 mt-6">© 2026 BeHealthy · Sức khỏe là tài sản quý giá nhất</p>
          </div>
        </div>
      )
    }

    // ====== ONBOARDING WIZARD (with per-day hourly schedule) ======

      const [selectedGoals, setSelectedGoals] = useState([])
      const [level, setLevel] = useState('beginner')
      const [motivation, setMotivation] = useState('')
      const [freeDays, setFreeDays] = useState([])
      const [freeHours, setFreeHours] = useState({}) // { dayIdx: [5,6,7,18,...] }
      const [durationMinutes, setDurationMinutes] = useState(30)
      const [equipment, setEquipment] = useState(['bodyweight'])
      const [injuries, setInjuries] = useState([])
      const [notes, setNotes] = useState('')

      const toggleGoal = id => setSelectedGoals(p => p.includes(id) ? p.filter(g => g !== id) : [...p, id])
      const toggleDay = idx => {
        setFreeDays(p => {
          if (p.includes(idx)) { const n = p.filter(d => d !== idx); const h = { ...freeHours }; delete h[idx]; setFreeHours(h); return n }
          return [...p, idx]
        })
      }
      const toggleHour = (dayIdx, hour) => {
        setFreeHours(p => {
          const hrs = p[dayIdx] || []
          return { ...p, [dayIdx]: hrs.includes(hour) ? hrs.filter(h => h !== hour) : [...hrs, hour].sort((a, b) => a - b) }
        })
      }
      const toggleEquip = eq => setEquipment(p => p.includes(eq) ? p.filter(e => e !== eq) : [...p, eq])
      const toggleInjury = inj => setInjuries(p => p.includes(inj) ? p.filter(i => i !== inj) : [...p, inj])

      const handleFinish = () => {
        const profile = { gender, birthYear, heightCm, weightKg, goals: selectedGoals.length > 0 ? selectedGoals : ['health'], goal: selectedGoals[0] || 'health', level, motivation, freeDays, freeHours, daysPerWeek: freeDays.length || 3, durationMinutes, equipment, injuries, notes, redFlags: [], createdAt: new Date().toISOString() }
        onComplete(profile)
      }

      const canNext = () => { if (step === 1) return heightCm > 0 && weightKg > 0; if (step === 2) return selectedGoals.length > 0; if (step === 3) return freeDays.length > 0; return true }

              <p className="text-sm text-slate-500 mt-1">Hãy giúp chúng mình hiểu bạn hơn để tạo giáo án phù hợp nhất</p>

            <div className="flex items-center justify-center gap-2 mb-8">

                <div><label className="block text-xs font-bold text-slate-700 mb-2">Chọn ngày rảnh trong tuần</label><div className="grid grid-cols-7 gap-2">{DAY_NAMES.map((day, idx) => <button key={idx} type="button" onClick={() => toggleDay(idx)} className={`rounded-2xl py-3 text-center border-2 transition-all ${freeDays.includes(idx) ? 'border-[#0A4D2E] bg-[#0A4D2E] text-white shadow-lg' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300'}`}><span className="block text-xs font-bold">{DAY_NAMES_SHORT[idx]}</span></button>)}</div></div>
                {/* Per-day hourly slots */}

                  <label className="block text-xs font-bold text-slate-700">Chọn giờ rảnh cụ thể cho mỗi ngày</label>

                        <span className="flex h-6 w-6 items-center justify-center rounded-lg bg-[#0A4D2E] text-white text-[10px] font-bold">{DAY_NAMES_SHORT[dayIdx]}</span>

                        {dayHours.length > 0 && <span className="text-[10px] text-slate-500 font-normal ml-auto">{dayHours.length} giờ đã chọn</span>}
                      </p>
                      <div className="grid grid-cols-6 sm:grid-cols-9 gap-1.5">
                        {HOUR_SLOTS.map(slot => <button key={slot.id} type="button" onClick={() => toggleHour(dayIdx, slot.hour)} className={`rounded-lg py-1.5 text-[11px] font-bold border transition-all ${dayHours.includes(slot.hour) ? 'border-emerald-500 bg-emerald-500 text-white shadow-sm' : 'border-slate-200 bg-white text-slate-500 hover:border-emerald-300 hover:bg-emerald-50'}`} title={slot.period}>{slot.label}</button>)}

              {step === 4 && <div className="space-y-6 animate-fade-in">
                <div className="flex items-center gap-3"><span className="text-2xl">🏋️</span><div><h2 className="text-xl font-bold text-slate-900">Thiết bị & Lưu ý</h2><p className="text-xs text-slate-500">Giáo án an toàn nhất cho bạn</p></div></div>
                <div><label className="block text-xs font-bold text-slate-700 mb-2">Thiết bị bạn có</label><div className="grid grid-cols-2 sm:grid-cols-3 gap-3">{[{ id: 'bodyweight', label: 'Không cần dụng cụ', icon: '🏃' }, { id: 'dumbbell', label: 'Tạ đơn', icon: '🏋️' }, { id: 'resistance_band', label: 'Dây kháng lực', icon: '🪢' }, { id: 'yoga_mat', label: 'Thảm yoga', icon: '🧘' }, { id: 'pull_up_bar', label: 'Xà đơn', icon: '💪' }, { id: 'jump_rope', label: 'Dây nhảy', icon: '⏭️' }].map(eq => <button key={eq.id} type="button" onClick={() => toggleEquip(eq.id)} className={`flex items-center gap-2 rounded-xl py-3 px-3 border-2 transition-all text-xs ${equipment.includes(eq.id) ? 'border-[#0A4D2E] bg-emerald-50 text-[#0A4D2E] font-bold shadow-sm' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300'}`}><span className="text-lg">{eq.icon}</span><span>{eq.label}</span></button>)}</div></div>
                <div><label className="block text-xs font-bold text-slate-700 mb-2">Vùng cơ thể cần lưu ý</label><div className="flex flex-wrap gap-2">{['knee', 'ankle', 'shoulder', 'wrist', 'lower_back', 'neck', 'hip'].map(inj => { const lb = { knee: '🦵 Đầu gối', ankle: '🦶 Mắt cá', shoulder: '💪 Vai', wrist: '✋ Cổ tay', lower_back: '🔙 Lưng dưới', neck: '🧣 Cổ', hip: '🦴 Hông' }; return <button key={inj} type="button" onClick={() => toggleInjury(inj)} className={`rounded-full px-3 py-1.5 text-xs font-semibold border transition-all ${injuries.includes(inj) ? 'border-red-400 bg-red-50 text-red-700' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300'}`}>{lb[inj]}</button> })}</div></div>
                <div><label className="block text-xs font-bold text-slate-700 mb-1.5">Ghi chú thêm <span className="text-slate-400 font-normal">(tùy chọn)</span></label><textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder="Tiền sử bệnh, hạn chế vận động..." rows={2} className="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm resize-none placeholder:text-slate-400" /></div>
                <div className="rounded-2xl bg-gradient-to-r from-emerald-50 to-green-50 p-4 border border-emerald-100 space-y-2"><p className="text-xs font-bold text-[#0A4D2E]">📋 Tóm tắt</p><div className="grid grid-cols-2 gap-2 text-xs text-slate-700"><span>🎯 {selectedGoals.map(g => GOALS_OPTIONS.find(o => o.id === g)?.label).join(', ')}</span><span>📅 {freeDays.length} ngày/tuần</span><span>⏱️ {durationMinutes} phút/buổi</span><span>📏 BMI: {(weightKg / Math.pow(heightCm / 100, 2)).toFixed(1)}</span></div></div>
              </div>}
              <div className="flex items-center justify-between pt-6 mt-6 border-t border-slate-100">
                {step > 1 ? <button type="button" onClick={() => setStep(step - 1)} className="flex items-center gap-1 rounded-xl px-5 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-100">← Quay lại</button> : <div />}
                {step < totalSteps ? <button type="button" onClick={() => setStep(step + 1)} disabled={!canNext()} className={`btn-tactile flex items-center gap-2 rounded-2xl px-6 py-3 text-sm font-bold text-white shadow-lg transition-all ${canNext() ? 'bg-[#0A4D2E] hover:bg-[#0D5C36] shadow-emerald-900/20' : 'bg-slate-300 cursor-not-allowed shadow-none'}`}>Tiếp theo →</button> : <button type="button" onClick={handleFinish} className="btn-tactile flex items-center gap-2 rounded-2xl bg-[#0A4D2E] px-6 py-3 text-sm font-bold text-white hover:bg-[#0D5C36] shadow-lg shadow-emerald-900/20">🚀 Hoàn tất & Bắt đầu</button>}
              </div>
            </div>
          </div>
        </div>
      )
    }

    // ====== PLAN GENERATOR ======
    function generateDefaultPlan(profile) {
      const freeDays = profile?.freeDays || [0, 2, 4]
      const dur = profile?.durationMinutes || 30
      const today = new Date()
      const mon = mondayOf(today)
      const templates = [
        [{ exerciseId: 'jumping-jacks', name: 'Nhảy dang tay chân', phase: 'warmup', sets: 1, durationSec: 45 }, { exerciseId: 'arm-circles', name: 'Xoay vai', phase: 'warmup', sets: 1, durationSec: 30 }, { exerciseId: 'bodyweight-squat', name: 'Squat không tạ', phase: 'main', sets: 3, reps: 12, restSec: 45 }, { exerciseId: 'glute-bridge', name: 'Nâng hông', phase: 'main', sets: 3, reps: 15, restSec: 45 }, { exerciseId: 'knee-push-up', name: 'Chống đẩy quỳ gối', phase: 'main', sets: 3, reps: 8, restSec: 45 }, { exerciseId: 'plank', name: 'Plank', phase: 'main', sets: 3, durationSec: 30, restSec: 45 }, { exerciseId: 'hamstring-stretch', name: 'Giãn cơ đùi sau', phase: 'cooldown', sets: 1, durationSec: 30 }],
        [{ exerciseId: 'march-in-place', name: 'Đi bộ tại chỗ nâng gối', phase: 'warmup', sets: 1, durationSec: 60 }, { exerciseId: 'bodyweight-squat', name: 'Squat không tạ', phase: 'main', sets: 3, reps: 12, restSec: 45 }, { exerciseId: 'glute-bridge', name: 'Nâng hông', phase: 'main', sets: 3, reps: 15, restSec: 45 }, { exerciseId: 'push-up', name: 'Chống đẩy', phase: 'main', sets: 3, reps: 10, restSec: 45 }, { exerciseId: 'mountain-climber', name: 'Leo núi tại chỗ', phase: 'main', sets: 3, durationSec: 30, restSec: 45 }, { exerciseId: 'quad-stretch', name: 'Giãn cơ đùi trước', phase: 'cooldown', sets: 1, durationSec: 30 }],
        [{ exerciseId: 'jumping-jacks', name: 'Nhảy dang tay chân', phase: 'warmup', sets: 1, durationSec: 45 }, { exerciseId: 'bodyweight-squat', name: 'Squat không tạ', phase: 'main', sets: 3, reps: 12, restSec: 45 }, { exerciseId: 'knee-push-up', name: 'Chống đẩy quỳ gối', phase: 'main', sets: 3, reps: 8, restSec: 45 }, { exerciseId: 'plank', name: 'Plank', phase: 'main', sets: 3, durationSec: 30, restSec: 45 }, { exerciseId: 'childs-pose', name: 'Tư thế em bé', phase: 'cooldown', sets: 1, durationSec: 45 }]
      ]
      const getTime = (dayIdx) => {
        const hrs = profile?.freeHours?.[dayIdx]
        if (hrs && hrs.length > 0) return `${String(hrs[0]).padStart(2, '0')}:00`
        return '06:00'
      }
      const sessions = freeDays.map((dayIdx, i) => {
        const date = new Date(mon); date.setDate(date.getDate() + dayIdx)
        return { dayOfWeek: dayIdx + 1, date: toYmd(date), startTime: getTime(dayIdx), minutes: dur, session: { tier: dur >= 40 ? 'full' : dur >= 25 ? 'short' : 'mini', items: templates[i % templates.length] } }
      })
      return { weekStart: toYmd(mon), sessions }
    }

    // ====== EXERCISE GUIDE MODAL ======
    function ExerciseGuideModal({ exercise, onClose }) {
      if (!exercise) return null
      const ex = EX_MAP[exercise] || exercises.find(e => e.name === exercise)
      if (!ex) return null
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4 animate-fade-in" onClick={onClose}>
          <div className="w-full max-w-lg rounded-3xl bg-white p-6 sm:p-8 shadow-2xl space-y-4 animate-slide-up" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <h2 className="text-xl font-black text-[#0A4D2E]">{ex.name}</h2>
              <button type="button" onClick={onClose} className="flex h-8 w-8 items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200">✕</button>
            </div>
            <div className="flex flex-wrap gap-2">
              <span className="rounded-full bg-emerald-50 px-2.5 py-1 text-[11px] font-bold text-emerald-700 border border-emerald-100">{ex.type === 'strength' ? '💪 Sức mạnh' : ex.type === 'cardio' ? '🏃 Cardio' : ex.type === 'hiit' ? '🔥 HIIT' : ex.type === 'stretch' ? '🧘 Giãn cơ' : '🔄 Mobility'}</span>
              <span className="rounded-full bg-blue-50 px-2.5 py-1 text-[11px] font-bold text-blue-700 border border-blue-100">Cấp {ex.level}</span>
              <span className="rounded-full bg-orange-50 px-2.5 py-1 text-[11px] font-bold text-orange-700 border border-orange-100">🔥 ~{ex.calPerMin} cal/phút</span>
            </div>
            <div className="rounded-2xl bg-emerald-50 p-4 border border-emerald-100">
              <p className="text-xs font-bold text-[#0A4D2E] mb-2">📖 Hướng dẫn thực hiện</p>
              <p className="text-sm text-slate-700 leading-relaxed">{ex.guide}</p>
            </div>
            <div className="grid grid-cols-2 gap-3 text-xs">
              <div className="rounded-xl bg-slate-50 p-3 border border-slate-100"><p className="font-bold text-slate-500 mb-1">💪 Nhóm cơ chính</p><p className="text-slate-800 font-semibold">{ex.muscles}</p></div>
              <div className="rounded-xl bg-slate-50 p-3 border border-slate-100"><p className="font-bold text-slate-500 mb-1">🎒 Dụng cụ cần thiết</p><p className="text-slate-800 font-semibold">{ex.reqEquipment}</p></div>
            </div>
            {ex.avoidIfInjury.length > 0 && <div className="rounded-xl bg-red-50 p-3 border border-red-100"><p className="text-xs font-bold text-red-700 mb-1">⚠️ Lưu ý chấn thương</p><p className="text-xs text-red-600">Cần thận trọng nếu bạn có vấn đề ở: {ex.avoidIfInjury.map(inj => { const lb = { knee: 'đầu gối', ankle: 'mắt cá', shoulder: 'vai', wrist: 'cổ tay', lower_back: 'lưng dưới', neck: 'cổ', hip: 'hông' }; return lb[inj] || inj }).join(', ')}</p></div>}
            <button type="button" onClick={onClose} className="btn-tactile w-full rounded-2xl bg-[#0A4D2E] py-3 text-sm font-bold text-white hover:bg-[#0D5C36] shadow-md">Đã hiểu</button>
          </div>
        </div>
      )
    }

    // ====== ENHANCED SCHEDULE TAB ======
    function ScheduleTab({ plan, profile, startWorkout, logs }) {
      const now = new Date()
      const mon = mondayOf(now)
      const todayYmd = toYmd(now)
      const [guideExId, setGuideExId] = useState(null)

      const weekDays = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(mon); d.setDate(d.getDate() + i)
        const ymd = toYmd(d)
        const session = plan?.sessions?.find(s => s.dayOfWeek === i + 1) || null
        const completed = logs.some(l => l.date === ymd)
        const isPast = ymd < todayYmd
        const isMissed = isPast && session && !completed
        return { dayIdx: i, date: d, ymd, dayName: DAY_NAMES[i], shortName: DAY_NAMES_SHORT[i], isToday: ymd === todayYmd, session, completed, isMissed, isPast, isFreeDay: profile?.freeDays?.includes(i) || false }
      })

      const freeHoursForDay = (dayIdx) => (profile?.freeHours?.[dayIdx] || []).map(h => `${String(h).padStart(2, '0')}:00`)

      return (
        <div className="space-y-6 animate-fade-in">
          <ExerciseGuideModal exercise={guideExId} onClose={() => setGuideExId(null)} />
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div><h2 className="text-2xl font-black text-[#0A4D2E]">Lịch tập tuần này</h2><p className="text-xs text-slate-500 mt-0.5">Tuần {fmtDayMonth(mon)} – {fmtDayMonth(new Date(mon.getTime() + 6 * 86400000))}</p></div>
            <div className="flex items-center gap-2 flex-wrap text-[11px] text-slate-500">
              <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>Hoàn thành</span>
              <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-red-400 inline-block"></span>Đã miss</span>
              <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-[#0A4D2E] inline-block"></span>Chưa tập</span>
              <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-slate-200 inline-block"></span>Nghỉ</span>
            </div>
          </div>

          {/* Weekly strip */}
          <div className="grid grid-cols-7 gap-2">
            {weekDays.map(wd => <div key={wd.dayIdx} className={`schedule-cell relative rounded-2xl p-3 text-center border-2 ${wd.isToday ? 'border-[#0A4D2E] bg-emerald-50 shadow-lg' : wd.completed ? 'border-emerald-300 bg-emerald-50/50' : wd.isMissed ? 'border-red-300 bg-red-50/50' : wd.session ? 'border-emerald-200 bg-white' : 'border-slate-200 bg-slate-50/50'}`}>
              {wd.isToday && <div className="absolute -top-1.5 left-1/2 -translate-x-1/2 px-2 py-0.5 rounded-full bg-[#0A4D2E] text-white text-[8px] font-bold">HÔM NAY</div>}
              <p className={`text-xs font-bold mt-1 ${wd.isToday ? 'text-[#0A4D2E]' : 'text-slate-600'}`}>{wd.shortName}</p>
              <p className={`text-lg font-black ${wd.isToday ? 'text-[#0A4D2E]' : 'text-slate-900'}`}>{wd.date.getDate()}</p>
              <div className="mt-1">
                {wd.completed ? <span className="inline-flex h-5 w-5 items-center justify-center rounded-full bg-emerald-500 text-white text-[10px]">✓</span>
                  : wd.isMissed ? <span className="inline-flex h-5 w-5 items-center justify-center rounded-full bg-red-400 text-white text-[10px]">✗</span>
                    : wd.session ? <span className="inline-flex h-5 w-5 items-center justify-center rounded-full bg-[#0A4D2E] text-white text-[10px]">🏋️</span>
                      : <span className="inline-flex h-5 w-5 items-center justify-center rounded-full bg-slate-200 text-slate-400 text-[10px]">–</span>}
              </div>
            </div>)}
          </div>

          {/* Session cards */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {plan?.sessions?.map((s, idx) => {
              const wd = weekDays[s.dayOfWeek - 1]
              const isCompleted = wd?.completed
              const isMissed = wd?.isMissed
              const isPast = wd?.isPast
              const cal = estimateCalories(s.session.items, s.minutes)
              const reqEq = sessionEquipment(s.session.items)
              const dayFreeHrs = freeHoursForDay(s.dayOfWeek - 1)

              return <div key={idx} className={`rounded-2xl p-5 border shadow-xs space-y-3 transition-all ${isCompleted ? 'bg-emerald-50/80 border-emerald-200' : isMissed ? 'bg-red-50/50 border-red-200 opacity-80' : 'bg-white border-slate-200 hover:shadow-md hover:border-emerald-200'}`}>
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className={`flex h-9 w-9 items-center justify-center rounded-xl text-sm font-bold ${isCompleted ? 'bg-emerald-500 text-white' : isMissed ? 'bg-red-400 text-white' : 'bg-[#0A4D2E] text-white'}`}>{isCompleted ? '✓' : isMissed ? '✗' : DAY_NAMES_SHORT[s.dayOfWeek - 1]}</span>
                    <div><p className="text-sm font-bold text-slate-900">{DAY_NAMES[s.dayOfWeek - 1]}</p><p className="text-[11px] text-slate-500">{s.date}</p></div>
                  </div>
                  <div className="text-right space-y-1">
                    <span className="rounded-lg bg-emerald-100/70 px-2 py-0.5 text-xs font-bold text-[#0A4D2E] block">{s.startTime}</span>
                    {isMissed && <span className="rounded-lg bg-red-100 px-2 py-0.5 text-[10px] font-bold text-red-600 block">❌ ĐÃ MISS</span>}
                    {isCompleted && <span className="rounded-lg bg-emerald-100 px-2 py-0.5 text-[10px] font-bold text-emerald-700 block">✅ XONG</span>}
                  </div>
                </div>

                {/* Stats row */}
                <div className="flex items-center gap-2 flex-wrap text-xs text-slate-600">
                  <span className="inline-flex items-center gap-1">⏱️ {s.minutes}p</span>
                  <span className="inline-flex items-center gap-1">💪 {s.session.items.length} bài</span>
                  <span className="inline-flex items-center gap-1 text-orange-600 font-bold">🔥 ~{cal} cal</span>
                </div>

                {/* Required equipment */}
                <div className="flex flex-wrap gap-1">
                  <span className="text-[10px] font-bold text-slate-500 mr-1">🎒 Cần:</span>
                  {reqEq.map(eq => <span key={eq} className="rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-semibold text-slate-600 border border-slate-200">{EQUIP_LABELS[eq] || eq}</span>)}
                </div>

                {/* Free hours for this day */}
                {dayFreeHrs.length > 0 && <div className="text-[10px] text-slate-400">⏰ Giờ rảnh: {dayFreeHrs.join(', ')}</div>}

                {/* Exercise list with clickable guide */}
                <div className="space-y-1 pt-2 border-t border-slate-100">
                  {s.session.items.map((it, i) => <button key={i} type="button" onClick={() => setGuideExId(it.exerciseId)} className="flex items-center justify-between text-xs text-slate-700 w-full text-left hover:bg-emerald-50 rounded-lg px-1.5 py-1 transition-colors group">
                    <span className="flex items-center gap-1.5">
                      <span className={`w-1.5 h-1.5 rounded-full ${it.phase === 'warmup' ? 'bg-amber-400' : it.phase === 'cooldown' ? 'bg-blue-400' : 'bg-emerald-500'}`} />
                      <span className="group-hover:text-[#0A4D2E] group-hover:underline">{it.name}</span>
                    </span>
                    <span className="font-semibold text-slate-400">{it.reps ? `${it.sets}×${it.reps}` : `${it.durationSec}s`}</span>
                  </button>)}
                </div>

                {/* Action */}
                {isMissed ? <div className="w-full rounded-xl bg-red-100 py-2.5 text-xs font-bold text-red-600 text-center mt-1">❌ Buổi này đã bị bỏ lỡ</div>
                  : isCompleted ? <div className="w-full rounded-xl bg-emerald-100 py-2.5 text-xs font-bold text-emerald-700 text-center mt-1">✅ Đã hoàn thành</div>
                    : <button type="button" onClick={() => startWorkout(s)} className="btn-tactile w-full rounded-xl bg-[#0A4D2E] py-2.5 text-xs font-bold text-white hover:bg-[#0D5C36] shadow-sm mt-1">▶ Bắt đầu buổi này</button>}
              </div>
            })}
          </div>

          <div className="rounded-2xl bg-gradient-to-r from-blue-50 to-indigo-50 p-4 border border-blue-100 flex items-start gap-3"><span className="text-2xl">💤</span><div><p className="text-sm font-bold text-slate-800">Ngày nghỉ ngơi cũng quan trọng!</p><p className="text-xs text-slate-500 mt-0.5">Cơ thể cần thời gian phục hồi. Ngủ đủ giấc và uống đủ nước nhé.</p></div></div>
        </div>
      )
    }

    // ====== MAIN APP ======
    function App() {
      const [authUser, setAuthUser] = useLocalStorage('bh_authUser', null)
      const [profileCompleted, setProfileCompleted] = useLocalStorage('bh_profileCompleted', false)
      const [tab, setTab] = useState('home')
      const [profile, setProfile] = useLocalStorage('bh_profile', null)
      const [plan, setPlan] = useLocalStorage('bh_weekPlan', null)
      const [logs, setLogs] = useLocalStorage('bh_logs', [])
      const [active, setActive] = useLocalStorage('bh_activeWorkout', null)
      const [searchQuery, setSearchQuery] = useState('')
      const [userMenuOpen, setUserMenuOpen] = useState(false)
      const [guideExId, setGuideExId] = useState(null)

      if (!authUser) return <AuthPage onLogin={u => { setAuthUser(u); if (!u.profileCompleted) setProfileCompleted(false) }} />
      if (!profileCompleted || !profile) return <OnboardingWizard user={authUser} onComplete={p => { setProfile(p); setPlan(generateDefaultPlan(p)); setProfileCompleted(true); const users = JSON.parse(localStorage.getItem('bh_users') || '[]'); localStorage.setItem('bh_users', JSON.stringify(users.map(u => u.id === authUser.id ? { ...u, profileCompleted: true } : u))); setAuthUser({ ...authUser, profileCompleted: true }) }} />

      const now = new Date()
      const todayYmd = toYmd(now)
      const dayIndex = (now.getDay() + 6) % 7
      const todayFormatted = `${DAY_NAMES[dayIndex]}, ${fmtDayMonth(now)}/${now.getFullYear()}`
      const goal = profile?.daysPerWeek || 3
      const thisWeekLogs = logs.filter(l => { const d = parseYmd(l.date); return d >= mondayOf(now) })
      const weekCount = thisWeekLogs.length
      const weekPct = Math.min(100, Math.round((weekCount / goal) * 100))

      // Calculate missed sessions
      const missedSessions = (plan?.sessions || []).filter(s => {
        const isPast = s.date < todayYmd
        const isCompleted = logs.some(l => l.date === s.date)
        return isPast && !isCompleted
      })

      // Next upcoming session
      const nextSession = (plan?.sessions || []).find(s => s.date >= todayYmd && !logs.some(l => l.date === s.date))

      // Total estimated calories this week
      const totalCalBurned = thisWeekLogs.reduce((sum, l) => sum + (l.calories || 0), 0)
      const totalCalPlanned = (plan?.sessions || []).reduce((sum, s) => sum + estimateCalories(s.session.items, s.minutes), 0)

      const startWorkout = s => { setActive({ date: s ? s.date : todayYmd, startedAt: Date.now(), session: s || plan?.sessions?.[0], progress: {} }); setTab('workout') }
      const handleLogout = () => { setAuthUser(null); setUserMenuOpen(false) }
      const handleResetProfile = () => { setProfileCompleted(false); setProfile(null); setUserMenuOpen(false) }

      const greeting = (() => { const h = now.getHours(); if (h < 12) return { text: 'Chào buổi sáng', emoji: '☀️' }; if (h < 18) return { text: 'Chào buổi chiều', emoji: '🌤️' }; return { text: 'Chào buổi tối', emoji: '🌙' } })()

      const NAV = [{ id: 'home', label: 'Trang chủ', icon: '🏠' }, { id: 'onboarding', label: 'Hồ sơ', icon: '👤' }, { id: 'exercises', label: 'Bài tập', icon: '📖' }, { id: 'schedule', label: 'Lịch tuần', icon: '📅' }, { id: 'workout', label: 'Tập luyện', icon: '🏋️' }, { id: 'progress', label: 'Tiến độ', icon: '⏱️' }]

      return (
        <div className="flex min-h-screen bg-[#F4F8F5] text-slate-900 antialiased font-sans">

                      const isToday = s.date === todayYmd
                      const cal = estimateCalories(s.session.items, s.minutes)
                      return <div key={i} className={`flex items-center justify-between rounded-xl p-3 ${isCompleted ? 'bg-emerald-50 border border-emerald-100' : isMissed ? 'bg-red-50 border border-red-100' : 'bg-slate-50 border border-slate-100'}`}>
                        <div className="flex items-center gap-3">
                          <span className={`flex h-8 w-8 items-center justify-center rounded-lg text-xs font-bold ${isCompleted ? 'bg-emerald-500 text-white' : isMissed ? 'bg-red-400 text-white' : 'bg-[#0A4D2E] text-white'}`}>{isCompleted ? '✓' : isMissed ? '✗' : DAY_NAMES_SHORT[s.dayOfWeek - 1]}</span>
                          <div><p className="text-xs font-bold text-slate-800">{DAY_NAMES[s.dayOfWeek - 1]} · {s.date}</p><p className="text-[10px] text-slate-500">{s.startTime} · {s.minutes}p · ~{cal} cal</p></div>
                        </div>
                        <span className={`rounded-full px-2.5 py-1 text-[10px] font-bold ${isCompleted ? 'bg-emerald-100 text-emerald-700' : isMissed ? 'bg-red-100 text-red-600' : isToday ? 'bg-amber-100 text-amber-700' : 'bg-slate-200 text-slate-500'}`}>{isCompleted ? '✅ Hoàn thành' : isMissed ? '❌ Đã miss' : isToday ? '⏳ Hôm nay' : '📅 Sắp tới'}</span>
                      </div>
                    })}
                  </div>
                </div>

                <div className="rounded-2xl bg-white p-5 border border-slate-200 shadow-xs space-y-3">
                  <h3 className="font-bold text-slate-900 text-sm">Lịch sử tập luyện</h3>
                  {logs.length === 0 ? <div className="text-center py-8"><span className="text-4xl block mb-3">🏃</span><p className="text-sm font-bold text-slate-600">Chưa có buổi tập nào</p><button type="button" onClick={() => setTab('schedule')} className="btn-tactile mt-4 rounded-full bg-[#0A4D2E] px-5 py-2 text-xs font-bold text-white hover:bg-[#0D5C36]">📅 Xem lịch tập</button></div>
                    : <div className="divide-y divide-slate-100">{logs.map((l, i) => <div key={i} className="py-2.5 flex items-center justify-between text-xs"><span className="font-bold text-slate-800">📅 {l.date}</span><div className="flex items-center gap-3"><span className="text-orange-600 font-bold">🔥 {l.calories || 0} cal</span><span className="text-emerald-700 font-semibold">{l.durationMin || 30}p · ✅</span></div></div>)}</div>}
                </div>
              </div>}
            </main>

            <footer className="mt-12 border-t border-slate-200/80 py-6 text-center text-xs text-slate-400">© 2026 BeHealthy · Nội dung mang tính tham khảo, không thay thế tư vấn y tế.</footer>
          </div>

          {/* MOBILE NAV */}
          <nav className="fixed inset-x-0 bottom-0 z-40 grid grid-cols-6 border-t border-slate-200/90 bg-white/95 backdrop-blur-md shadow-xl lg:hidden">
            {NAV.map(item => <button key={item.id} type="button" onClick={() => setTab(item.id)} className={`flex min-h-[56px] flex-col items-center justify-center py-2 px-1 text-[10px] font-semibold transition-all ${tab === item.id ? 'text-[#0A4D2E] scale-105' : 'text-slate-500'}`}><span className="text-base">{item.icon}</span><span className="mt-0.5 leading-tight">{item.label}</span></button>)}
          </nav>
        </div>
      )
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />)
  </script>
</body>

</html>
